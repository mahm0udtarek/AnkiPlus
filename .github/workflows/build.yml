name: Build debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew :AnkiDroid:assembleFullDebug --no-daemon -Dorg.gradle.jvmargs=-Xmx5g
      - uses: actions/upload-artifact@v4
        with:
          name: AnkiPlus-debug-apk
          path: AnkiDroid/build/outputs/apk/full/debug/*.apk
